# default profile
server:
  port: 8081

springdoc:
  api-docs:
    path: /openapi # http://localhost:8081/openapi

# Actuator & Metrics (Prometheus + Grafana)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized # Скрывает детали БД/Диска от анонимов
      probes:
        enabled: true # Включает livenessState и readinessState для Kubernetes/Docker
  prometheus:
    metrics:
      export:
        enabled: true # Включает экспорт метрик в формате Prometheus
  metrics:
    tags:
      application: ${spring.application.name:post-service}
      env: ${SPRING_PROFILES_ACTIVE:production}
    distribution:
      percentiles-histogram:
        http.server.requests: true # Генерирует гистограммы latency (buckets) для Grafana
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
  tracing:
    sampling:
      probability: 1.0 # трассировать 100% запросов.
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web: DEBUG
    com.gmail.alexei28.shortcut.microservices: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

spring:
  application:
    name: post-service
  docker:
    # Only for development
    # Если docker образа не существует, Spring Boot автоматически скачает и создаст его при запуске приложения.
    # Для локальной разработки. Spring Boot будет сам следить за тем, чтобы база данных была «жива»,
    # Rогда вы нажимаете кнопку Run/Stop, контейнер kafka_postgres будет автоматически запущен, а при остановке приложения — остановлен.
    # Как это работает.
    # Когда вы запускаете приложение:
    # - Spring ищет в корне проекта файлы типа postgresql-post-service-docker-compose.yml или compose.yaml.
    # - Вызывает postgresql-post-service-docker-compose.yml.
    # - Spring автоматически подменяет spring.datasource.url, username и password, считывая их прямо из вашего YAML-файла.
    #   Вам даже не нужно прописывать их в application.yml вручную!
    # - При остановке приложения Spring делает docker-compose stop.
    compose:
      file: postgresql-post-service-docker-compose.yml
      lifecycle-management: start_and_stop
      readiness:
        tcp:
          connect-timeout: 10s
  jpa:
    hibernate:
      ddl-auto: update # Изменено с create на update, чтобы не удалять данные при каждом перезапуске
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
  datasource:
    url: jdbc:postgresql://localhost:5435/post_service_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
