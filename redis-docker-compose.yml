# Проверить наличие Redis:
# docker-compose -f redis-docker-compose.yml up -d

# Подключение Redis через redis-cli:
# docker exec -it redis_app redis-cli -a my_master_password ping
# В ответ должно вернуться: PONG.

version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis_app
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass my_master_password

  # UI client for Redis
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis

volumes:
  redis_data:
  redis_insight_data: