  services:
    # ========================== INFRASTRUCTURE ==========================

    # =====================================================
    # ELK Stack (Elasticsearch, Logstash, Kibana)
    # =====================================================
    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
      container_name: elasticsearch
      restart: always
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - ES_JAVA_OPTS=-Xms512m -Xmx512m
      ports:
        - "9200:9200"
      networks:
        - app-network

    logstash:
      image: docker.elastic.co/logstash/logstash:8.11.0
      container_name: logstash
      restart: always
      volumes:
        - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      ports:
        - "5000:5000"
      depends_on:
        - elasticsearch
      networks:
        - app-network

    kibana:
      image: docker.elastic.co/kibana/kibana:8.11.0
      container_name: kibana
      restart: always
      ports:
        - "5601:5601"
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
        - elasticsearch
      networks:
        - app-network

    # =====================================================
    # Jaeger - позволяет увидеть весь путь одного запроса.
    # =====================================================
    jaeger:
      image: jaegertracing/all-in-one:latest
      container_name: jaeger
      restart: always
      ports:
        - "16686:16686" # Jaeger UI
        - "4317:4317"   # OTLP gRPC
        - "4318:4318"   # OTLP HTTP
      networks:
        - app-network

    # =====================================================
    # PostgreSQL (Post-Service)
    # =====================================================
    postgres-db:
      image: postgres:16
      container_name: post-service-postgresql
      restart: always
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=post_service_db
      ports:
        - "5435:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - app-network

    # ==========================================
    # Prometheus & Grafana
    # ==========================================
    prometheus:
      image: prom/prometheus:v2.51.0
      container_name: prometheus
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus_data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.enable-lifecycle'
      ports:
        - "9090:9090"
      restart: always
      networks:
        - app-network

    grafana:
      image: grafana/grafana:10.4.0
      container_name: grafana
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=your_secure_password
        - GF_USERS_ALLOW_SIGN_UP=false
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus
      restart: always
      networks:
        - app-network

    # ==========================================
    # Redis & RedisInsight(GUI)
    # ==========================================
    redis:
      image: redis:alpine
      container_name: redis_app
      restart: always
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      command: redis-server --save 60 1 --loglevel warning --requirepass my_master_password
      networks:
        - app-network

    # Redis GUI client
    redis-insight:
      image: redis/redisinsight:latest
      container_name: redis_insight
      restart: always
      ports:
        - "5540:5540"
      volumes:
        - redis_insight_data:/data
      depends_on:
        - redis
      networks:
        - app-network

    # ==========================================
    # Vault (secrets)
    # ==========================================
    vault:
      image: hashicorp/vault:1.20
      container_name: vault
      restart: always
      ports:
        - "8200:8200"
      cap_add:
        - IPC_LOCK
      environment:
        - VAULT_ADDR=http://127.0.0.1:8200
      volumes:
        - vault-data:/vault/data
        - ./vault/config:/vault/config
      command: vault server -config=/vault/config/vault.hcl
      networks:
        - app-network

    # ==========================================
    # MY APPLICATION SERVICES
    # ==========================================

    post-service:
      build:
        context: .
        dockerfile: post-service/Dockerfile
      container_name: post-service
      restart: always
      ports:
        - "8081:8081" # Порт приложения наружу
      environment:
        SPRING_PROFILES_ACTIVE: docker
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/post_service_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres
        MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
        SPRING_CLOUD_VAULT_HOST: vault
        SPRING_CLOUD_VAULT_PORT: "8200"
        SPRING_CLOUD_VAULT_SCHEME: http
        VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required} # In root folder create .env file and add VAULT_TOKEN
      depends_on:
        - postgres-db
        - jaeger
        - vault
      networks:
        - app-network

    api-gateway:
      build:
        context: .
        dockerfile: api-gateway/Dockerfile
      container_name: api-gateway
      restart: always
      ports:
        - "8080:8080" # Основной входной порт для клиентов
      environment:
        SPRING_PROFILES_ACTIVE: docker
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/post_service_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres
        SPRING_CLOUD_VAULT_HOST: vault
        SPRING_CLOUD_VAULT_PORT: "8200"
        SPRING_CLOUD_VAULT_SCHEME: http
        VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required} # In root folder create .env file and add VAULT_TOKEN
      depends_on:
        - redis
        - post-service
        - jaeger
        - vault
      networks:
        - app-network

  # ==========================================
  # Volumes & Networks
  # ==========================================
  volumes:
    postgres_data:
    prometheus_data:
    grafana_data:
    redis_data:
    redis_insight_data:
    vault-data:

  networks:
    app-network:
      driver: bridge