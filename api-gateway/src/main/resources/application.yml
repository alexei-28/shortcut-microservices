server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

# Actuator settings
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true

      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        spring.cloud.gateway.requests: 0.5, 0.95, 0.99

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379
      password: my_master_password

  cloud:
    gateway:
      metrics:
        enabled: true
      default-filters:
        # В Spring Cloud Gateway RequestRateLimiter с Redis по умолчанию использует алгоритм Token Bucket
        - name: RequestRateLimiter
          args:
            # Сколько токенов добавляется в ведро за 1 секунду (Refill Rate)
            redis-rate-limiter.replenishRate: 10
            # Максимальная емкость ведра (Capacity), определяющая допустимый размер мгновенного всплеска
            redis-rate-limiter.burstCapacity: 20
            # Сколько токенов списывается за 1 HTTP-запрос (по умолчанию 1)
            redis-rate-limiter.requestedTokens: 1
            # Ссылка на Spring Bean ключ
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: post-service
          uri: http://localhost:8081
          predicates:
            - Path=/post/**
          #filters:
          #  - StripPrefix=1
