# Основной / Development профиль — приложения на хосте (не в Docker-е)
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  config:
    import: vault://
  graphql:
    path: /graphql
    graphiql:
      enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${redis.password}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cloud:
    gateway:
      metrics:
        enabled: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: post-service
          # В development режиме post-service запущен на хосте
          uri: http://localhost:8081
          predicates:
            - Path=/post/**,/graphql

    vault:
      uri: http://localhost:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        default-context: api-gateway  # Указываем Spring Boot где Spring Cloud Vault будет искать секрет

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:api-gateway}
      env: ${SPRING_PROFILES_ACTIVE:development}
    enable:
      all: true
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: WARN
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.boot.autoconfigure.graphql: TRACE