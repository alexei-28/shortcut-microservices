server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379
      password: my_master_password

  cloud:
    gateway:
      default-filters:
        # В Spring Cloud Gateway RequestRateLimiter с Redis по умолчанию использует алгоритм Token Bucket
        - name: RequestRateLimiter
          args:
            # Сколько токенов добавляется в ведро за 1 секунду (Refill Rate)
            redis-rate-limiter.replenishRate: 10
            # Максимальная емкость ведра (Capacity), определяющая допустимый размер мгновенного всплеска
            redis-rate-limiter.burstCapacity: 20
            # Сколько токенов списывается за 1 HTTP-запрос (по умолчанию 1)
            redis-rate-limiter.requestedTokens: 1
            # Ссылка на Spring Bean ключ
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/orders/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1
