server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  config:
    import: vault://
  graphql:
    path: /graphql
    graphiql:
      enabled: true

  # Настройка работы с Redis (Rate Limiter / Cache / Sessions)
  data:
    redis:
      host: redis
      port: 6379
      password: ${redis.password} # get from Vault
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cloud:
    # Spring Cloud Gateway
    gateway:
      metrics:
        enabled: true
      default-filters:
        # Стандартная реализация RequestRateLimiter из коробки в Spring Cloud Gateway использует Redis.
        # В Spring Cloud Gateway RequestRateLimiter с Redis по умолчанию использует алгоритм Token Bucket.
        # Основной класс, который предоставляет Spring Cloud Gateway «из коробки», — это RedisRateLimiter.
        # Почему именно Redis?
        # 1. Распределенный лимитинг: Поскольку API Gateway обычно масштабируется на несколько экземпляров (nodes),
        #    Redis служит единым распределенным хранилищем состояния счетчиков/токенов.
        # 2. Атомарность (Lua-скрипт): Алгоритм Token Bucket реализован прямо внутри Redis с помощью встроенного Lua-скрипта.
        #    Это гарантирует атомарность проверки и списания токенов без состояний гонки (race conditions) между копиями API Gateway.
        - name: RequestRateLimiter
          args:
            # Сколько токенов добавляется в ведро за 1 секунду (Refill Rate)
            redis-rate-limiter.replenishRate: 10
            # Максимальная емкость ведра (Capacity), определяющая допустимый размер мгновенного всплеска
            redis-rate-limiter.burstCapacity: 20
            # Сколько токенов списывается за 1 HTTP-запрос (по умолчанию 1)
            redis-rate-limiter.requestedTokens: 1
            # Ссылка на Spring Bean ключ
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: post-service
          uri: http://post-service:8081
          predicates:
            - Path=/post/**,/graphql

    # Spring Cloud Vault (secrets)
    vault:
      uri: http://vault:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        default-context: application

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true

  health:
    redis:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name:api-gateway}
      env: ${SPRING_PROFILES_ACTIVE:production}
    enable:
      all: true
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: WARN
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.boot.autoconfigure.graphql: TRACE